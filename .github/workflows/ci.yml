# C4 — Integración continua: compila la web y la app móvil y ejecuta las pruebas en cada push y pull request.
# No despliega ni usa secretos: el despliegue a Azure sigue siendo manual.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  web:
    name: Web y pruebas
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar la web sin avisos
        run: dotnet build ProsegurGDT/ProsegurGDT.Web/ProsegurGDT.Web.csproj -c Release -warnaserror
      - name: Iniciar SQL Server LocalDB (pruebas de integración)
        run: sqllocaldb start MSSQLLocalDB
      - name: Ejecutar las pruebas
        run: dotnet test ProsegurGDT/ProsegurGDT.Tests/ProsegurGDT.Tests.csproj -c Release --logger "trx;LogFileName=pruebas.trx" --collect "XPlat Code Coverage"
      - name: Publicar los resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-pruebas
          path: ProsegurGDT/ProsegurGDT.Tests/TestResults
          if-no-files-found: ignore

  movil:
    name: App móvil (Android)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Instalar la carga de trabajo de .NET MAUI para Android
        run: dotnet workload install maui-android
      - name: Compilar la app
        run: dotnet build ProsegurGDT/ProsegurGDT.Movil/ProsegurGDT.Movil.csproj -c Debug
